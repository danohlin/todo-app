<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="title-group">
          <h1>To do list</h1>
          <p class="subtitle">Plan your day. Focus on what matters.</p>
        </div>

        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">
          <span class="theme-label">Dark</span>
        </button>
      </header>

      <form id="todo-form" class="todo-form" aria-label="Add todo">
        <input
          id="todo-input"
          type="text"
          placeholder="Add a task (e.g., Buy groceries)"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn-primary">Add</button>
      </form>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden>No todos yet — add one above.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
